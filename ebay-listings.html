}
@media (prefers-color-scheme: dark) {

    --bg: #0c0e14; --surface: #14161e; --surface-2: #1c1f2a;

    --green: #4caf78; --green-bg: #0e2318;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e14; --surface: #14161e; --surface-2: #1c1f2a;
  --border: #272b38; --fg: #e2ddd0; --muted: #8a8fa8;
  --accent: #c9a94f; --accent-bg: #221c0e; --accent-border: #9a7a28;

  --green: #4caf78; --green-bg: #0e2318;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.55; margin: 0; padding: 28px 16px 48px; }
.page-wrap { max-width: 980px; margin-inline: auto; }
header { margin-bottom: 22px; }
.eyebrow { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
h1 { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(24px, 4.5vw, 36px); font-weight: 700; line-height: 1.1; text-wrap: balance; margin: 0 0 6px; letter-spacing: -0.01em; }
.subtitle { color: var(--muted); font-size: 13px; }

/* Filter bar */
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; }
.search-input { flex: 1 1 180px; min-width: 140px; padding: 7px 11px; font-size: 13px; font-family: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; color: var(--fg); outline: none; }
.search-input:focus { border-color: var(--accent-border); }
.filter-group { display: flex; flex-wrap: wrap; gap: 5px; }
.f-btn { padding: 5px 11px; font-size: 12px; font-weight: 500; font-family: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; transition: background .1s, color .1s, border-color .1s; }
.f-btn:hover, .f-btn.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }
.count-bar { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

/* Grid */
.grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } }

/* Card */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.card-photo { width: 100%; height: 180px; background: var(--surface-2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.card-photo img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
.card-photo .photo-nav { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
.card-photo .photo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); cursor: pointer; transition: background .15s; }
.card-photo .photo-dot.active { background: var(--accent); }
.card-photo .photo-prev, .card-photo .photo-next { position: absolute; top: 50%; transform: translateY(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: 5px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; color: var(--muted); opacity: 0; transition: opacity .15s; user-select: none; }
.card-photo .photo-prev { left: 6px; }
.card-photo .photo-next { right: 6px; }
.card-photo:hover .photo-prev, .card-photo:hover .photo-next { opacity: 1; }
.card-head { padding: 13px 13px 11px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.rank { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--badge-bg); color: var(--badge-fg); display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.card-title-wrap { flex: 1; min-width: 0; }
.item-name { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; line-height: 1.25; margin: 0 0 6px; text-wrap: balance; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
.tag.price { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); font-weight: 600; }
.tag.cond-new  { background: var(--green-bg); color: var(--green); border-color: transparent; }
.tag.cond-other { background: var(--accent-bg); color: var(--accent); border-color: transparent; }
.tag.cond-used  { background: var(--surface-2); color: var(--muted); border-color: transparent; }
.card-body { padding: 12px 13px; display: flex; flex-direction: column; gap: 11px; flex: 1; }
.field-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.copy-row { display: flex; gap: 7px; align-items: flex-start; }
.copy-box { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px; font-family: inherit; color: var(--fg); line-height: 1.5; white-space: pre-wrap; word-break: break-word; cursor: text; user-select: text; }
.copy-btn { flex-shrink: 0; padding: 6px 10px; font-size: 12px; font-weight: 500; font-family: inherit; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; transition: background .1s, color .1s, border-color .1s; white-space: nowrap; line-height: 1.4; }
.copy-btn:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }
.copy-btn.ok { background: var(--green-bg); color: var(--green); border-color: transparent; }
.char-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; }
.char-count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

.char-fill { height: 100%; background: var(--accent); border-radius: 2px; }
.char-fill.warn { background: #c04040; }
.no-results { grid-column: 1/-1; text-align: center; padding: 48px 16px; color: var(--muted); font-size: 14px; }
</style>

    rank:116, id:"016", name:"Revenge of the Sith — Comic Book #4 of 4 (Dark Horse)",
    price:10, year:2005, condLabel:"Used", condClass:"cond-used",
    condEbay:"Used — reading copy, cover and spine wear",
    title:"Star Wars Revenge of the Sith Dark Horse Comics Issue #4 of 4 2005",
    desc:`Star Wars Revenge of the Sith comic book #4 of 4 by Dark Horse Comics (2005). Reading-copy condition with cover and spine wear.

Condition: Reading copy. Cover and spine wear.
Year: 2005
Ships from Puerto Rico (USPS Priority Mail with tracking).`
  }
];

const photoState = {};

function setPhoto(id, idx) {
  const wrap = document.getElementById('ph-' + id);
  if (!wrap) return;
  const n = PHOTOS[id] || 1;
  idx = ((idx % n) + n) % n;
  photoState[id] = idx;
  wrap.querySelector('img').src = `${BASE}img/${id}-${idx+1}.jpg`;
  wrap.querySelectorAll('.photo-dot').forEach((d,i) => d.classList.toggle('active', i===idx));
}

function changePhoto(id, delta) {
  setPhoto(id, (photoState[id] || 0) + delta);
}

let activeMin = 0;

function setPriceFilter(btn) {
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeMin = parseInt(btn.dataset.min);
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const filtered = listings.filter(item => {
    const matchesPrice = item.price >= activeMin;
    if (!matchesPrice) return false;
    if (!q) return true;
    return item.name.toLowerCase().includes(q) || item.title.toLowerCase().includes(q) || item.id.includes(q);
  });
  renderGrid(filtered);
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 1800);
  }).catch(() => {
    const el = btn.previousElementSibling;
    const range = document.createRange(); range.selectNodeContents(el);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    btn.textContent = 'Selected';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1800);
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderGrid(items) {
  const grid = document.getElementById('grid');
  const bar = document.getElementById('count-bar');
  bar.textContent = `Showing ${items.length} of ${listings.length} items`;
  grid.innerHTML = '';
  if (items.length === 0) {
    grid.innerHTML = '<p class="no-results">No items match your search.</p>';
    return;
  }
  items.forEach(item => {
    const tl = item.title.length;
    const pct = Math.min(tl / 80, 1);
    const warn = tl > 80;
    const card = document.createElement('div');
    card.className = 'card';
    const titleJson = JSON.stringify(item.title);
    const descJson = JSON.stringify(item.desc);
    const numPhotos = PHOTOS[item.id] || 1;
    const photoUrls = Array.from({length: numPhotos}, (_, i) => `${BASE}img/${item.id}-${i+1}.jpg`);
    const photoHtml = `
      <div class="card-photo" id="ph-${item.id}">
        <img src="${photoUrls[0]}" alt="${escapeHtml(item.name)}" onerror="this.closest('.card-photo').style.display='none'">
        ${numPhotos > 1 ? `
        <button class="photo-prev" onclick="changePhoto('${item.id}',-1)">&#8249;</button>
        <button class="photo-next" onclick="changePhoto('${item.id}',1)">&#8250;</button>
        <div class="photo-nav">${photoUrls.map((_,i)=>`<div class="photo-dot${i===0?' active':''}" onclick="setPhoto('${item.id}',${i})"></div>`).join('')}</div>` : ''}
      </div>`;
    card.innerHTML = `${photoHtml}
      <div class="card-head">
        <div class="rank">${item.rank}</div>
        <div class="card-title-wrap">
          <p class="item-name">${escapeHtml(item.name)}</p>
          <div class="tags">
            <span class="tag price">$${item.price}</span>
            <span class="tag ${item.condClass}">${item.condLabel}</span>
            <span class="tag">${item.year}</span>
            <span class="tag">#${item.id}</span>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div>
          <p class="field-label">eBay Title <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">(80 char max)</span></p>
          <div class="copy-row">
            <div class="copy-box">${escapeHtml(item.title)}</div>
            <button class="copy-btn" onclick="copyText(${titleJson}, this)">Copy</button>
          </div>
          <div class="char-bar">
            <span class="char-count${warn?' warn':''}">${tl}/80</span>
            <div class="char-track"><div class="char-fill${warn?' warn':''}" style="width:${Math.round(pct*100)}%"></div></div>
          </div>
        </div>
        <div>
          <p class="field-label">eBay Condition</p>
          <div class="copy-box" style="font-size:12.5px">${escapeHtml(item.condEbay)}</div>
        </div>
        <div>
          <p class="field-label">Description</p>
          <div class="copy-row">
            <div class="copy-box" style="font-size:12.5px">${escapeHtml(item.desc)}</div>
            <button class="copy-btn" onclick="copyText(${descJson}, this)">Copy</button>
          </div>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

renderGrid(listings);
</script>
</body>
</html>
