name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'products.json'
      - 'build_site.py'
      - 'img/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image library
        run: pip install Pillow
      - name: Regenerate index.html + thumbnails from products.json
        run: python build_site.py
      - name: Commit regenerated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html img/thumbs
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-rebuild index.html + thumbnails [skip ci]"
            git push
          fi
